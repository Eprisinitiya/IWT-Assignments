<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>
    <style>
        table {
            border-collapse: collapse;
            width: 50%;
            text-align: center;
        }
        th, td {
            border: 1px solid #007bff;
            padding: 10px;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        .highlight {
            background-color: #ffcc00;
        }
        .special-day {
            background-color: #007bff;
            color: white;
        }
    </style>
</head>
<body>

<h1>December 2024 Calendar</h1>

<table cellspacing="21" cellpadding="21">
    <tr>
        <th colspan="7">December 2024</th>
    </tr>
    <tr>
        <th>Sun</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th>Fri</th>
        <th>Sat</th>
    </tr>
    <tr>
        <td class="highlight"></td>
        <td class="highlight"></td>
        <td class="highlight"></td>
        <td class="highlight"></td>
        <td>1</td>
        <td>2</td>
        <td>3</td>
    </tr>
    <tr>
        <td>4</td>
        <td>5</td>
        <td>6</td>
        <td>7</td>
        <td>8</td>
        <td>9</td>
        <td>10</td>
    </tr>
    <tr>
        <td>11</td>
        <td>12</td>
        <td>13</td>
        <td>14</td>
        <td>15</td>
        <td>16</td>
        <td>17</td>
    </tr>
    <tr>
        <td>18</td>
        <td>19</td>
        <td>20</td>
        <td>21</td>
        <td class="special-day">22</td>
        <td>23</td>
        <td>24</td>
    </tr>
    <tr>
        <td class="highlight">25</td>
        <td>26</td>
        <td>27</td>
        <td>28</td>
        <td>29</td>
        <td>30</td>
        <td class="highlight">31</td>
    </tr>
</table>

</body>
</html>
