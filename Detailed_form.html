<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h2 {
            text-align: center;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        input[type="submit"] {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #218838;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
        }
        .col {
            flex: 50%;
            padding: 10px;
        }
        .col-full {
            flex: 100%;
            padding: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Student Registration Form</h2>

    <form action="#" method="post">
        <h3>Basic Information</h3>
        <div class="row">
            <div class="col">
                <label for="fname">First Name</label>
                <input type="text" id="fname" name="fname" required>
            </div>
            <div class="col">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" name="lname" required>
            </div>
        </div>

        <label for="student-number">Student Number</label>
        <input type="text" id="student-number" name="student-number" placeholder="e.g. 11183021" required>

        <label for="year-level">Year Level</label>
        <select id="year-level" name="year-level" required>
            <option value="">Please Select</option>
            <option value="1">Year 1</option>
            <option value="2">Year 2</option>
            <option value="3">Year 3</option>
            <option value="4">Year 4</option>
        </select>

        <label for="degree">Degree Program</label>
        <select id="degree" name="degree" required>
            <option value="">Please Select</option>
        </select>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="myname@example.com" required>

        <label for="phone">Phone Number</label>
        <input type="text" id="phone" name="phone" placeholder="000-000-0000" required>

        <h3>Present Address</h3>
        <label for="street1">Street Address</label>
        <input type="text" id="street1" name="street1" required>

        <label for="street2">Street Address Line 2</label>
        <input type="text" id="street2" name="street2">

        <div class="row">
            <div class="col">
                <label for="city">City</label>
                <input type="text" id="city" name="city" required>
            </div>
            <div class="col">
                <label for="state">State / Province</label>
                <input type="text" id="state" name="state" required>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="postal">Postal / Zip Code</label>
                <input type="text" id="postal" name="postal" required>
            </div>
            <div class="col">
                <label for="country">Country</label>
                <select id="country" name="country" required>
                    <option value="United States">United States</option>
                </select>
            </div>
        </div>

         <h3>Resources Available</h3>
         <div class="checkbox-group">
             <label><input type="checkbox" name="resources" value="Car/Transportation"> Car/Transportation</label>
             <label><input type="checkbox" name="resources" value="Event Venue/House"> Event Venue/House</label>
             <label><input type="checkbox" name="resources" value="Printer"> Printer</label>
             <label><input type="checkbox" name="resources" value="LCD Projector"> LCD Projector</label>
             <label><input type="checkbox" name="resources" value="Laptop"> Laptop</label>
         </div><br>

         <h3>Skills/Talents</h3>
         <div class="checkbox-group">
             <label><input type="checkbox" name="skills" value="Acting"> Acting</label>
             <label><input type="checkbox" name="skills" value="Arts/Crafts"> Arts/Crafts</label>
             <label><input type="checkbox" name="skills" value="Calculating"> Calculating</label>
             <label><input type="checkbox" name="skills" value="Dancing"> Dancing</label>
             <label><input type="checkbox" name="skills" value="Debating"> Debating</label>
             <label><input type="checkbox" name="skills" value="Drawing"> Drawing</label>
             <label><input type="checkbox" name="skills" value="Eating"> Eating</label>
             <label><input type="checkbox" name="skills" value="Fashion"> Fashion</label>
             <label><input type="checkbox" name="skills" value="Photography"> Photography</label>
             <label><input type="checkbox" name="skills" value="Playing Drums"> Playing Drums</label>
             <label><input type="checkbox" name="skills" value="Playing Guitar"> Playing Guitar</label>
             <label><input type="checkbox" name="skills" value="Playing Piano"> Playing Piano</label>
             <label><input type="checkbox" name="skills" value="Programming"> Programming</label>
             <label><input type="checkbox" name="skills" value="Singing"> Singing</label>
             <label><input type="checkbox" name="skills" value="Writing"> Writing</label>
             <label><input type="checkbox" name="skills" value="Others"> Others</label>
         </div>

        <h3>Emergency Contact</h3>
        <label for="emergency-name">Contact Name</label>
        <input type="text" id="emergency-name" name="emergency-name" required>

        <label for="emergency-relationship">Relationship</label>
        <input type="text" id="emergency-relationship" name="emergency-relationship" placeholder="e.g. Father, Mother, etc." required>

        <label for="emergency-phone">Phone Number</label>
        <input type="text" id="emergency-phone" name="emergency-phone" placeholder="000-000-0000" required>

        <label for="emergency-email">Email</label>
        <input type="email" id="emergency-email" name="emergency-email" placeholder="example@example.com" required>

        <input type="submit" value="Submit">
    </form>
</div>

</body>
</html>
